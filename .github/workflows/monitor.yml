name: Kitiya Monitor Bot

on:
  schedule:
    # 15分ごとに自動実行（UTC表記）
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動実行ボタン用

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      # 1. 前回の SQLite データベースをキャッシュから確実に復元
      - name: Restore SQLite DB Cache
        uses: actions/cache/restore@v4
        with:
          path: kitiya_data.db
          key: kitiya-db-${{ github.run_id }}
          restore-keys: |
            kitiya-db-

      # 2. 監視スクリプトの実行
      - name: Run Monitor Script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python kitiya_monitor.py

      # 3. 更新された SQLite データベースをキャッシュとして保存
      - name: Save SQLite DB Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: kitiya_data.db
          key: kitiya-db-${{ github.run_id }}
